name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android export environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export APK
        run: godot --headless --path . --export-debug "Android" open-world-3d.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-world-3d-android
          path: open-world-3d.apk
          if-no-files-found: error
          retention-days: 14
